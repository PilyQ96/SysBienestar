<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><ui:insert name="titulo">BieneSoft</ui:insert></title>
    <!-- Link de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Iconos de Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- CSS del Dashboard (usando el manejador de recursos de JSF: resources/css/styleDashboard.css) -->
    <h:outputStylesheet library="css" name="styleDashboard.css" />
</h:head>
<h:body>
    <div id="dashboard">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div id="logoUnse">
                <!-- Sidebar Navigation -->
                <h:link outcome="/inicio.xhtml">
                    <!-- Imagen gestionada por JSF: resources/fotos/logoUnse.png -->
                    <h:graphicImage library="fotos" name="logoUnse.png" alt="Logo UNSE" />
                </h:link>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <h:link outcome="/inicio.xhtml">
                        <i class="fa-solid fa-house"></i> Inicio
                    </h:link>
                </li>
                <li class="nav-item">
                    <h:link outcome="/reservas.xhtml">
                        <i class="fa-brands fa-leanpub"></i> Reservas
                    </h:link>
                </li>
                <li class="nav-item">
                    <h:link outcome="/calendario.xhtml">
                        <i class="fa-solid fa-calendar-days"></i> Calendario
                    </h:link>
                </li>
                <li class="nav-item">
                    <h:link outcome="/socios.xhtml">
                        <i class="fa-solid fa-circle-user"></i> Socios
                    </h:link>
                </li>
                <li class="nav-item">
                    <h:link outcome="/informes.xhtml">
                        <i class="fa-solid fa-file-lines"></i> Informes
                    </h:link>
                </li>
                <li class="nav-item">
                    <h:link outcome="/portal/main.xhtml">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar Sesión
                    </h:link>
                </li>
            </ul>
        </aside>
        <!-- Contenedor Principal Dinámico -->
        <main id="contenedorMain">
            <section id="contenido">
                <ui:insert name="contenido">
                    <!-- Contenido por defecto si la vista no define nada -->
                </ui:insert>
            </section>
        </main>
    </div>
</h:body>
</html>
