<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      lang="es" xml:lang="es">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BieneSoft | Panel</title>
    <!--link de bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <!--iconos de font awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!--link csss-->
    <link rel="stylesheet" href="../recursos/css/styleDashboard.css" />
</h:head>

<h:body>
    <div id="dashboard">
        <aside class="sidebar">
            <div id="logoUnse">
                <a href="#">
                    <img src="../recursos/fotos/logoUNSE morado corregido.png" alt="Logo Unse" />
                </a>
            </div>
            <h:form id="formNav" prependId="false">
                <ul class="nav-menu">
                    <li class="nav-item active">
                        <h:commandLink actionListener="#{dashboardBean.irAInicio}">
                            <i class="fa-solid fa-house"></i> Inicio
                            <f:ajax execute="@form" render="@form" />
                        </h:commandLink>
                    </li>
                    <li class="nav-item">
                        <h:commandLink actionListener="#{dashboardBean.irAReservas}">
                            <i class="fa-solid fa-calendar-check"></i> Reservas
                            <f:ajax execute="@form" render="@form" />
                        </h:commandLink>
                    </li>
                    <li class="nav-item">
                        <h:commandLink actionListener="#{dashboardBean.irACalendario}">
                            <i class="fa-solid fa-calendar-days"></i> Calendario
                            <f:ajax execute="@form" render="@form" />
                        </h:commandLink>
                    </li>
                    <li class="nav-item">
                        <h:commandLink actionListener="#{dashboardBean.irASocios}">
                            <i class="fa-solid fa-users"></i> Socios
                            <f:ajax execute="@form" render="@form" />
                        </h:commandLink>
                    </li>
                    <li class="nav-item">
                        <h:commandLink actionListener="#{dashboardBean.irAInformes}">
                            <i class="fa-solid fa-file-lines"></i> Informes
                            <f:ajax execute="@form" render="@form" />
                        </h:commandLink>
                    </li>
                </ul>
                <ul class="nav-menu nav-menu-footer">
                    <li class="nav-item">
                        <h:commandLink action="/main?faces-redirect=true">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar sesión
                            <f:ajax execute="@form" />
                        </h:commandLink>
                    </li>
                </ul>
            </h:form>
        </aside>
        <main id="contenedorMain">
            <header id="topbar">
                <div>
                    <p class="subtitulo">BieneSoft</p>
                    <h1>Dashboard</h1>
                </div>
            </header>

            <section id="contenido">
                <div class="stats-grid">
                    <div class="stat-card"></div>
                    <div class="stat-card"></div>
                    <div class="stat-card"></div>
                    <div class="stat-card"></div>
                </div>

                <div class="paneles-grid">
                    <div class="panel">
                        <h3 class="subtitulo"></h3>
                        <p class="panel-vacio"></p>
                    </div>
                    <div class="panel">
                        <h3 class="subtitulo"></h3>
                        <p class="panel-vacio"></p>
                    </div>
                </div>
            </section>
        </main>
    </div>
</h:body>

</html>
